[package]
name = "kraken-upscale"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
description = "Native AI video upscaler"

[dependencies]
slint = { version = "1.17", features = ["unstable-winit-030"] }
rfd = "0.15"
rayon = "1.12"
base64 = "0.22"
png = "0.17"

[target.'cfg(windows)'.dependencies]
ort = { version = "=2.0.0-rc.13", features = ["cuda"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
candle-core = "0.11"
libloading = "0.8"

[build-dependencies]
slint-build = "1.17"
winresource = "0.1.31"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Keep debug builds usable: the UI is unbearable without optimized deps.
[profile.dev.package."*"]
opt-level = 2
