[package]
name = "kraken-upscale"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
description = "Native AI video upscaler"

[dependencies]
slint = { version = "1.17", features = ["raw-window-handle-06"] }
raw-window-handle = "0.6"
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
ort = { version = "=2.0.0-rc.13", features = ["cuda"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
candle-core = "0.11"

[build-dependencies]
slint-build = "1.17"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Keep debug builds usable: the UI is unbearable without optimized deps.
[profile.dev.package."*"]
opt-level = 2
